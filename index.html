<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>國字學習與描紅練習 2.0</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="國字描紅">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    :root { --card:#fff; --border:#e2e8f0; --muted:#64748b; --accent:#0ea5e9; }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Roboto,Arial,sans-serif;background:#f8fafc;color:#0f172a;}
    .container{max-width:980px;margin:24px auto;padding:0 16px;}

    .tabs{display:flex;border-bottom:1px solid var(--border);gap:8px;}
    .tab-link{display:inline-block;text-decoration:none;padding:10px 14px;border-bottom:2px solid transparent;font-size:15px;color:#334155;}
    .tab-link.active{border-bottom-color:var(--accent);color:#0f172a;font-weight:600;}

    .tab-panel{display:none;padding:14px 2px;}
    .tab-panel.active{display:block;}

    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
    select,button,input[type="color"],input[type="search"],input[type="text"]{height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px}
    button{cursor:pointer;background:var(--accent);color:#fff;border:none}
    button.secondary{background:#0f172a}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .title{font-size:28px;font-weight:700;display:flex;gap:8px;align-items:baseline}
    .zhuyin{font-size:32px;letter-spacing:4px}
    .lesson{font-size:16px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 300px;gap:16px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .canvasWrap{position:relative;border:1px dashed #cbd5e1;border-radius:12px;background:#fff;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    canvas{width:100%;height:auto;max-height:70vh;touch-action:none;background:#fff}
    .list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
    .list li{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff;display:flex;justify-content:space-between;align-items:center}
    .section{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:13px}

    /* 搜尋 */
    .result-line{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff}
    .chip{display:inline-block;margin:4px 6px 0 0;padding:4px 8px;border:1px solid var(--border);border-radius:999px;background:#f8fafc;font-size:12px;color:#0f172a}
    .result-title{font-weight:700;margin-bottom:6px}
  
    body{background:linear-gradient(180deg,#eff6ff 0,#f8fafc 240px);}
    .container{max-width:1080px}.tabs{position:sticky;top:0;z-index:10;background:rgba(248,250,252,.92);backdrop-filter:blur(14px);padding-top:8px}
    .card{box-shadow:0 8px 30px rgba(15,23,42,.06);border-radius:18px}.tab-link{font-size:16px;padding:14px 18px}
    button{font-weight:700;min-height:42px}.search-card{padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;margin:10px 0}
    .search-char{font-size:48px;font-weight:800}.fav-btn{float:right;background:#fff;color:#f59e0b;border:1px solid #fde68a;font-size:20px}
    .word-chip{display:inline-block;padding:6px 10px;margin:4px;border-radius:999px;background:#e0f2fe;color:#075985}
    .word-quiz{display:none;text-align:center;padding:28px 16px}
    .word-quiz.active{display:block}
    .word-prompt{font-size:18px;color:var(--muted);margin-bottom:12px}
    .word-question{font-size:58px;font-weight:800;letter-spacing:8px;margin:12px 0 26px}
    .word-options{display:grid;grid-template-columns:repeat(2,minmax(100px,180px));gap:14px;justify-content:center}
    .word-option{height:72px;font-size:34px;border:2px solid #bae6fd;background:#fff;color:#0f172a}
    .word-option:hover{background:#e0f2fe}
    .word-option.wrong{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
    .word-option.correct{background:#dcfce7;color:#166534;border-color:#86efac}
    .word-option:disabled{cursor:not-allowed}
    .word-feedback{min-height:34px;margin-top:22px;font-size:18px;font-weight:700}
    @media (max-width:520px){.word-question{font-size:46px}.word-option{height:64px;font-size:30px}}
    @media (prefers-color-scheme:dark){:root{--card:#111827;--border:#334155;--muted:#94a3b8}body{background:#020617;color:#e5e7eb}.tabs{background:rgba(2,6,23,.9)}select,input,.result-line,.list li,.search-card{background:#111827;color:#e5e7eb}.canvasWrap,canvas{background:#fff}.tab-link{color:#cbd5e1}}
  
    body{background:linear-gradient(180deg,#eff6ff 0,#f8fafc 240px);}
    .container{max-width:1080px}.tabs{position:sticky;top:0;z-index:10;background:rgba(248,250,252,.92);backdrop-filter:blur(14px);padding-top:8px}
    .card{box-shadow:0 8px 30px rgba(15,23,42,.06);border-radius:18px}.tab-link{font-size:16px;padding:14px 18px}
    button{font-weight:700;min-height:42px}.search-card{padding:14px;border:1px solid var(--border);border-radius:16px;background:#fff;margin:10px 0}
    .search-char{font-size:48px;font-weight:800}.fav-btn{float:right;background:#fff;color:#f59e0b;border:1px solid #fde68a;font-size:20px}
    .word-chip{display:inline-block;padding:6px 10px;margin:4px;border-radius:999px;background:#e0f2fe;color:#075985}
    @media (prefers-color-scheme:dark){:root{--card:#111827;--border:#334155;--muted:#94a3b8}body{background:#020617;color:#e5e7eb}.tabs{background:rgba(2,6,23,.9)}select,input,.result-line,.list li,.search-card{background:#111827;color:#e5e7eb}.canvasWrap,canvas{background:#fff}.tab-link{color:#cbd5e1}}
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <a id="tabSettingsBtn" class="tab-link active" href="#settings">設定</a>
      <a id="tabPracticeBtn" class="tab-link" href="#practice">練習</a>
      <a id="tabSearchBtn" class="tab-link" href="#search">搜尋</a>
    </div>

    <!-- 設定 -->
    <div id="settings" class="tab-panel active">
      <div class="card section">
        <div class="row">
          <label>年級學期：
            <select id="termSelect" title="選擇年級學期">
              <option value="小一下">小一下</option>
              <option value="小二上">小二上</option>
              <option value="小二下">小二下</option>
              <option value="小三上">小三上</option>
              <option value="小三下" selected>小三下</option>
            </select>
          </label>
          <label>範圍：
            <select id="lessonMax" title="選擇測驗到第幾課">
              <option value="1">第 1 課</option><option value="2">第 2 課</option>
              <option value="3">第 3 課</option><option value="4">第 4 課</option>
              <option value="5">第 5 課</option><option value="6">第 6 課</option>
              <option value="7">第 7 課</option><option value="8">第 8 課</option>
              <option value="9">第 9 課</option><option value="10">第 10 課</option>
              <option value="11">第 11 課</option><option value="12" selected>第 12 課</option>
            </select>
          </label>
          <label>每字次數：
            <select id="reqPasses" title="每個字需要描紅幾次">
              <option>1</option><option>2</option><option selected>3</option>
              <option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            </select>
          </label>
          <label>練習題型：
            <select id="quizType" title="選擇練習題型">
              <option value="tracing">生字描紅</option>
              <option value="word-choice">詞語選字</option>
            </select>
          </label>
          <label>筆色：
            <input id="penColor" type="color" value="#000000" title="筆色" />
          </label>
        </div>

        <div id="weightRow" class="row" style="margin-top:8px; display:none;">
          <label>當期權重：
            <select id="currWeight" title="當期課程出題比例">
              <option value="50">50%</option><option value="75" selected>75%</option><option value="100">100%</option>
            </select>
          </label>
          <div id="mixPreview" class="muted">—</div>
        </div>

        <div class="row" style="margin-top:8px;">
          <label>練習模式：<select id="practiceMode"><option value="all">全部生字</option><option value="favorites">收藏字</option><option value="mistakes">錯字加強</option></select></label>
          <button id="btnStartPractice" type="button">開始練習</button>
        </div>

        <div class="row" style="margin-top:8px;">
          <div style="font-weight:600;">統計資料：</div>
          <div>累計完成題數：<span id="statsTotal">0</span></div>
          <button id="btnResetStats" type="button" class="secondary" title="清除統計">清除統計</button>
        </div>
      </div>
    </div>

    <!-- 練習 -->
    <div id="practice" class="tab-panel">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="title">
            <span class="zhuyin" id="zhuyin">—</span>
            <span class="lesson" id="lessonInfo"></span>
          </div>
          <div id="traceActions" class="row">
            <button id="btnClear" type="button" class="secondary">清除</button>
            <button id="btnRecognize" type="button">檢查</button>
            <button id="btnNext" type="button" class="secondary">下一題</button>
          </div>
        </div>
      </div>

      <div class="grid" style="margin-top:12px;">
        <div id="traceCard" class="card">
          <div class="canvasWrap">
            <canvas id="pad" width="600" height="600"></canvas>
          </div>
        </div>
        <div id="wordQuizCard" class="card word-quiz" aria-live="polite">
          <div class="word-prompt">請選出詞語中缺少的正確國字</div>
          <div id="wordQuestion" class="word-question">—</div>
          <div id="wordOptions" class="word-options"></div>
          <div id="wordFeedback" class="word-feedback"></div>
        </div>
        <div class="card">
          <h3 style="margin: 4px 0 8px;">進度 / 訊息</h3>
          <ul id="recogList" class="list"></ul>
        </div>
      </div>
    </div>

    <!-- 搜尋 -->
    <div id="search" class="tab-panel">
      <div class="card section">
        <div class="row">
          <input id="charQuery" type="text" placeholder="輸入國字、注音或詞語" style="min-width:220px;flex:1">
          <button id="btnDoSearch" type="button">查詢</button>
        </div>
        <div id="searchHint" class="muted">可搜尋國字、注音與詞語；點星號可加入收藏。</div>
      </div>

      <div class="card" style="margin-top:12px;">
        <div id="searchResult"></div>
      </div>
    </div>
  </div>

  <script src="./database/g1s2.js"></script>
  <script src="./database/g2s1.js"></script>
  <script src="./database/g2s2.js"></script>
  <script src="./database/g3s1.js"></script>
  <script src="./database/g3s2.js"></script>
  <script src="./database/index.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(console.log);
    }
  </script>
</body>
</html>
